server:
  address: 0.0.0.0
  port: ${GATEWAY_SERVER_PORT:8081}

spring:
  application:
    name: fitness-core-gateway
  datasource:
    url: ${GATEWAY_DB_URL:jdbc:mysql://127.0.0.1:3307/fitness?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia%2FShanghai}
    username: ${GATEWAY_DB_USERNAME:}
    password: ${GATEWAY_DB_PASSWORD:}
    hikari:
      read-only: true
      maximum-pool-size: ${GATEWAY_DB_MAX_POOL_SIZE:10}
      connection-timeout: ${GATEWAY_DB_CONNECTION_TIMEOUT_MS:3000}

gateway:
  security:
    # 生产环境必须由 Secret Manager 注入，不能使用默认值。
    internal-service-token: ${GATEWAY_INTERNAL_SERVICE_TOKEN:}
    context-signing-secret: ${GATEWAY_CONTEXT_SIGNING_SECRET:}
    max-context-ttl-seconds: ${GATEWAY_MAX_CONTEXT_TTL_SECONDS:300}
    confirmation-signing-secret: ${GATEWAY_CONFIRMATION_SIGNING_SECRET:}
  training-service:
    base-url: ${GATEWAY_TRAINING_SERVICE_BASE_URL:http://127.0.0.1:8082}
    internal-service-token: ${GATEWAY_TRAINING_SERVICE_TOKEN:}
    timeout-milliseconds: ${GATEWAY_TRAINING_SERVICE_TIMEOUT_MS:5000}
  booking-service:
    base-url: ${GATEWAY_BOOKING_SERVICE_BASE_URL:http://127.0.0.1:8083}
    internal-service-token: ${GATEWAY_BOOKING_SERVICE_TOKEN:}
    timeout-milliseconds: ${GATEWAY_BOOKING_SERVICE_TIMEOUT_MS:5000}

logging:
  level:
    com.shuyiwa.fitness.gateway: INFO
