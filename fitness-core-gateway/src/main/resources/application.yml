server:
  address: 0.0.0.0
  port: ${GATEWAY_SERVER_PORT:8081}

spring:
  application:
    name: fitness-core-gateway
  datasource:
    url: ${GATEWAY_DB_URL:jdbc:mysql://127.0.0.1:3307/fitness?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia%2FShanghai}
    username: ${GATEWAY_DB_USERNAME:}
    password: ${GATEWAY_DB_PASSWORD:}
    hikari:
      read-only: true
      maximum-pool-size: ${GATEWAY_DB_MAX_POOL_SIZE:10}
      connection-timeout: ${GATEWAY_DB_CONNECTION_TIMEOUT_MS:3000}

gateway:
  security:
    # 生产环境必须由 Secret Manager 注入，不能使用默认值。
    internal-service-token: ${GATEWAY_INTERNAL_SERVICE_TOKEN:}
    context-signing-secret: ${GATEWAY_CONTEXT_SIGNING_SECRET:}
    context-signing-algorithm: ${GATEWAY_CONTEXT_SIGNING_ALGORITHM:HS256}
    context-signing-key-id: ${GATEWAY_CONTEXT_SIGNING_KEY_ID:legacy}
    # 轮换期间通过标准 Spring 配置注入旧 kid -> secret 的 Map；当前主密钥仍使用上面的 secret。
    # 例如环境变量可使用 GATEWAY_SECURITY_CONTEXT_SIGNING_KEY_RING_V1。
    context-signing-key-ring: {}
    # RS256 只配置公钥，私钥必须留在认证服务；轮换时按 kid 增加公钥。
    context-verification-public-key-ring: {}
    context-verification-jwks-url: ${GATEWAY_CONTEXT_VERIFICATION_JWKS_URL:}
    context-verification-jwks-cache-seconds: ${GATEWAY_CONTEXT_VERIFICATION_JWKS_CACHE_SECONDS:300}
    context-verification-jwks-timeout-milliseconds: ${GATEWAY_CONTEXT_VERIFICATION_JWKS_TIMEOUT_MS:2000}
    max-context-ttl-seconds: ${GATEWAY_MAX_CONTEXT_TTL_SECONDS:300}
    confirmation-signing-secret: ${GATEWAY_CONFIRMATION_SIGNING_SECRET:}
    confirmation-signing-algorithm: ${GATEWAY_CONFIRMATION_SIGNING_ALGORITHM:HS256}
    confirmation-signing-key-id: ${GATEWAY_CONFIRMATION_SIGNING_KEY_ID:legacy}
    confirmation-signing-key-ring: {}
    confirmation-verification-public-key-ring: {}
    confirmation-verification-jwks-url: ${GATEWAY_CONFIRMATION_VERIFICATION_JWKS_URL:}
    confirmation-verification-jwks-cache-seconds: ${GATEWAY_CONFIRMATION_VERIFICATION_JWKS_CACHE_SECONDS:300}
    confirmation-verification-jwks-timeout-milliseconds: ${GATEWAY_CONFIRMATION_VERIFICATION_JWKS_TIMEOUT_MS:2000}
  training-service:
    base-url: ${GATEWAY_TRAINING_SERVICE_BASE_URL:http://127.0.0.1:8082}
    internal-service-token: ${GATEWAY_TRAINING_SERVICE_TOKEN:}
    timeout-milliseconds: ${GATEWAY_TRAINING_SERVICE_TIMEOUT_MS:5000}
  booking-service:
    base-url: ${GATEWAY_BOOKING_SERVICE_BASE_URL:http://127.0.0.1:8083}
    internal-service-token: ${GATEWAY_BOOKING_SERVICE_TOKEN:}
    timeout-milliseconds: ${GATEWAY_BOOKING_SERVICE_TIMEOUT_MS:5000}

logging:
  level:
    com.shuyiwa.fitness.gateway: INFO
