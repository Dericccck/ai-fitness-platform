[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fitness-tool-contracts"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.12,<3", "cryptography>=43,<51", "httpx>=0.27,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/fitness_tool_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
