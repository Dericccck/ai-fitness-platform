# Copy this file to application-local.yml for local integration tests.
# Do not commit real credentials.
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/test?useUnicode=true&characterEncoding=utf-8
    username: ${FITNESS_TEST_DB_USERNAME:root}
    password: ${FITNESS_TEST_DB_PASSWORD:}
  redis:
    host: ${FITNESS_TEST_REDIS_HOST:localhost}
    port: ${FITNESS_TEST_REDIS_PORT:6379}
    password: ${FITNESS_TEST_REDIS_PASSWORD:}
