[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fitness-ocr-service"
version = "0.1.0"
description = "Private OCR and document-structure service for the fitness Agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "pypdf>=5,<7",
    "python-multipart>=0.0.20,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
inference = [
    "paddleocr[doc-parser]>=3.3,<4.0",
    "paddlepaddle>=3.2.1,<4.0",
]
dev = [
    "httpx>=0.27,<1.0",
    "mypy>=1.13,<2.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
