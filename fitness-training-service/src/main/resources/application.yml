server:
  address: 0.0.0.0
  port: ${TRAINING_SERVER_PORT:8082}

spring:
  application:
    name: fitness-training-service
  datasource:
    url: ${TRAINING_DB_URL:jdbc:mysql://127.0.0.1:3307/fitness?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia%2FShanghai}
    username: ${TRAINING_DB_USERNAME:}
    password: ${TRAINING_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${TRAINING_DB_MAX_POOL_SIZE:10}
      connection-timeout: ${TRAINING_DB_CONNECTION_TIMEOUT_MS:3000}
  rabbitmq:
    host: ${TRAINING_RABBITMQ_HOST:127.0.0.1}
    port: ${TRAINING_RABBITMQ_PORT:5672}
    username: ${TRAINING_RABBITMQ_USERNAME:fitness_agent}
    password: ${TRAINING_RABBITMQ_PASSWORD:fitness_agent_secret}
    publisher-confirms: ${TRAINING_RABBITMQ_PUBLISHER_CONFIRMS:true}
    publisher-returns: true
    template:
      mandatory: true

training:
  # 只允许 Gateway 调用训练服务。生产环境必须通过 Secret Manager 注入。
  internal-service-token: ${TRAINING_INTERNAL_SERVICE_TOKEN:}
  # 本地首次启动可自动执行幂等迁移；生产环境建议由独立迁移 Job 执行同一份 SQL 后关闭。
  schema-init-enabled: ${TRAINING_SCHEMA_INIT_ENABLED:true}
  outbox:
    publisher-enabled: ${TRAINING_OUTBOX_PUBLISHER_ENABLED:false}
    fixed-delay-ms: ${TRAINING_OUTBOX_FIXED_DELAY_MS:1000}
    batch-size: ${TRAINING_OUTBOX_BATCH_SIZE:20}
    max-attempts: ${TRAINING_OUTBOX_MAX_ATTEMPTS:8}
    claim-lease-seconds: ${TRAINING_OUTBOX_CLAIM_LEASE_SECONDS:60}
    retry-base-seconds: ${TRAINING_OUTBOX_RETRY_BASE_SECONDS:5}
    confirm-timeout-ms: ${TRAINING_OUTBOX_CONFIRM_TIMEOUT_MS:5000}
    exchange: ${TRAINING_OUTBOX_EXCHANGE:fitness.domain.events}
    routing-key: ${TRAINING_OUTBOX_ROUTING_KEY:training.plan.published}

logging:
  level:
    com.shuyiwa.fitness.training: INFO
