name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-service:
    name: Python Agent Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitness-agent-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: fitness-agent-service/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: fitness-agent-service/uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --extra eval --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy app

      - name: Test
        run: uv run pytest

      - name: Database migration contract
        run: uv run python scripts/migration_contract_check.py

      - name: Runtime prompt snapshot and regression dataset contract
        run: |
          uv run --extra eval python -m app.evaluation.prompt_regression --export "$RUNNER_TEMP/runtime-prompts.json"
          uv run --extra eval python -m app.evaluation.prompt_regression --dataset evals/prompt_regression.json --report "$RUNNER_TEMP/prompt-contract.json"

      - name: Archive prompt contract evidence (not a live-model quality score)
        uses: actions/upload-artifact@v4
        with:
          name: runtime-prompt-contract
          path: |
            ${{ runner.temp }}/runtime-prompts.json
            ${{ runner.temp }}/prompt-contract.json

      - name: Observability contract
        run: uv run python scripts/observability_contract_check.py

      - name: Production configuration contract
        run: uv run python scripts/production_config_contract_check.py

      - name: Prometheus alert rule tests
        run: |
          docker run --rm \
            --entrypoint promtool \
            -v "$GITHUB_WORKSPACE/deployment/observability:/etc/prometheus:ro" \
            prom/prometheus:v2.54.1 \
            test rules /etc/prometheus/tests/fitness-agent-alerts.test.yml /etc/prometheus/tests/runtime-delivery-alerts.test.yml

      - name: Alertmanager configuration contract
        run: |
          docker run --rm \
            --entrypoint amtool \
            -v "$GITHUB_WORKSPACE/deployment/observability:/etc/alertmanager:ro" \
            prom/alertmanager:v0.27.0 \
            check-config /etc/alertmanager/alertmanager.yml

      - name: RAG evaluation quality gate
        run: uv run python -m app.rag.evaluation_cli --cases evals/rag_smoke.json --thresholds evals/rag_thresholds.json

      - name: Operations trend evaluation quality gate
        run: uv run python -m app.agent.operations_evaluation --cases evals/operations_trend_smoke.json --thresholds evals/operations_trend_thresholds.json

      - name: Operations comparison evaluation quality gate
        run: uv run python -m app.agent.operations_comparison_evaluation --cases evals/operations_comparison_smoke.json --thresholds evals/operations_comparison_thresholds.json

      - name: Operations query policy evaluation quality gate
        run: uv run python -m app.agent.operations_policy_evaluation --cases evals/operations_policy_smoke.json --thresholds evals/operations_policy_thresholds.json

      - name: TruLens deterministic evaluation contract
        run: uv run --extra eval python -m app.evaluation.trulens_cli --no-persist --cases evals/trulens_smoke.json --thresholds evals/trulens_thresholds.json --release evals/trulens_smoke.release.json --eval-release-id trulens-smoke-20260905-v1

      - name: Build production container image
        run: docker build --file Dockerfile --tag fitness-agent-service:${{ github.sha }} .

      # 用本次构建得到的不可变镜像 ID 生成发布制品；后续环境只提升同一制品，不重新构建。
      - name: Validate immutable release manifest
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          IMAGE_DIGEST="$(docker image inspect fitness-agent-service:${SOURCE_COMMIT} --format '{{.Id}}')"
          uv run python scripts/release_manifest_check.py \
            --build \
            --manifest "$RUNNER_TEMP/agent-release.manifest.json" \
            --config-contract ../deployment/environments/agent.staging.env.example \
            --environment staging \
            --source-commit "$SOURCE_COMMIT" \
            --image "fitness-agent-service@${IMAGE_DIGEST}" \
            --expected-environment staging

      # GitHub 托管 Runner 默认没有真实 Embedding/Reranker 权重，因此不生成伪造的
      # v2 模型摘要。配置组织级变量后（通常由带制品挂载的受控 Runner 提供），才启用
      # 运行时代码导出、真实模型制品摘要、索引构建 ID 和 v2 Manifest 的完整门禁。
      - name: Build and validate v2 release manifest when inputs are configured
        if: ${{ vars.AGENT_RELEASE_MODEL_ARTIFACT_ROOT != '' || vars.AGENT_RELEASE_INDEX_BUILD_ID != '' }}
        env:
          MODEL_ARTIFACT_ROOT: ${{ vars.AGENT_RELEASE_MODEL_ARTIFACT_ROOT }}
          INDEX_BUILD_ID: ${{ vars.AGENT_RELEASE_INDEX_BUILD_ID }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          test -d "$MODEL_ARTIFACT_ROOT/embedding"
          test -d "$MODEL_ARTIFACT_ROOT/reranker"
          uv run python scripts/build_runtime_release_components.py \
            --output "$RUNNER_TEMP/agent-release.components.json" \
            --eval-release evals/trulens_smoke.release.json \
            --model-artifact "embedding=$MODEL_ARTIFACT_ROOT/embedding" \
            --model-artifact "reranker=$MODEL_ARTIFACT_ROOT/reranker" \
            --index-build-id "$INDEX_BUILD_ID"
          IMAGE_DIGEST="$(docker image inspect fitness-agent-service:${SOURCE_COMMIT} --format '{{.Id}}')"
          uv run python scripts/release_manifest_check.py \
            --build \
            --manifest "$RUNNER_TEMP/agent-release-v2.manifest.json" \
            --config-contract ../deployment/environments/agent.staging.env.example \
            --schema-version 2 \
            --components "$RUNNER_TEMP/agent-release.components.json" \
            --environment staging \
            --source-commit "$SOURCE_COMMIT" \
            --image "fitness-agent-service@${IMAGE_DIGEST}" \
            --expected-environment staging

  fitness-java-services:
    name: Java ${{ matrix.service }}
    strategy:
      fail-fast: false
      matrix:
        service: [fitness-core-gateway, fitness-training-service, fitness-booking-service, fitness-customer-service]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      # 只构建独立的健身核心 Gateway；根目录历史 Java 快照不属于本服务的构建边界。
      - name: Test independent Java service
        run: ./mvnw --batch-mode -f ${{ matrix.service }}/pom.xml clean test

      - name: Build independent image (do not publish or deploy)
        run: docker build -t ${{ matrix.service }}:${{ github.sha }} ${{ matrix.service }}

  runtime-delivery-integration:
    name: Isolated PostgreSQL and Redis runtime acceptance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: acceptance
          POSTGRES_PASSWORD: acceptance
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U acceptance" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: fitness-agent-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version-file: fitness-agent-service/.python-version
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.32"
      - run: uv sync --locked --extra eval --extra dev
      - name: Upgrade, assert real runtime contracts, rollback and remove only the temporary database
        env:
          AGENT_DATABASE_URL: postgresql+asyncpg://acceptance:acceptance@127.0.0.1:5432/postgres
          AGENT_REDIS_URL: redis://127.0.0.1:6379/0
        run: uv run python scripts/runtime_delivery_live_check.py --execute

  fitness-web:
    name: Frontend streaming contract and image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitness-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: fitness-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: docker build -t fitness-web:${{ github.sha }} .

  ocr-service:
    name: OCR Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitness-ocr-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: fitness-ocr-service/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: fitness-ocr-service/uv.lock

      # 契约测试使用注入的 fake engine，不在 CI 中下载大型 Paddle 推理模型。
      - name: Install locked service dependencies
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy app

      - name: Test OCR HTTP contract
        run: uv run pytest

      - name: Build OCR production image
        run: docker build --file Dockerfile --tag fitness-ocr-service:${{ github.sha }} .

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan repository history
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
