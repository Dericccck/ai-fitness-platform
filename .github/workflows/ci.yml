name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-service:
    name: Python Agent Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitness-agent-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: fitness-agent-service/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: fitness-agent-service/uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy app

      - name: Test
        run: uv run pytest

  java-backend:
    name: Java Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      # 历史 POM 默认跳过依赖外部环境的旧测试；先保证核心代码在干净环境可复现编译。
      # 新增 Agent Tool Gateway 能力必须配套可隔离测试，并在后续阶段加入此质量门禁。
      - name: Compile Java backend
        run: mvn --batch-mode -DskipTests compile

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan repository history
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
