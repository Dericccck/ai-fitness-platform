name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-service:
    name: Python Agent Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitness-agent-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: fitness-agent-service/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: fitness-agent-service/uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy app

      - name: Test
        run: uv run pytest

      - name: RAG evaluation quality gate
        run: uv run python -m app.rag.evaluation_cli --cases evals/rag_smoke.json --thresholds evals/rag_thresholds.json

      - name: Build production container image
        run: docker build --file Dockerfile --tag fitness-agent-service:${{ github.sha }} .

  fitness-core-gateway:
    name: Fitness Core Tool Gateway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
          cache-dependency-path: fitness-core-gateway/pom.xml

      # 只构建独立的健身核心 Gateway；根目录历史 Java 快照不属于本服务的构建边界。
      - name: Test fitness core gateway
        run: ./mvnw --batch-mode -f fitness-core-gateway/pom.xml clean test

  ocr-service:
    name: OCR Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitness-ocr-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: fitness-ocr-service/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: fitness-ocr-service/uv.lock

      # 契约测试使用注入的 fake engine，不在 CI 中下载大型 Paddle 推理模型。
      - name: Install locked service dependencies
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy app

      - name: Test OCR HTTP contract
        run: uv run pytest

      - name: Build OCR production image
        run: docker build --file Dockerfile --tag fitness-ocr-service:${{ github.sha }} .

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan repository history
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
