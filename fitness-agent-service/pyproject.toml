[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fitness-agent-service"
version = "0.1.0"
description = "Enterprise AI agent service for the fitness platform"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<1.0",
    "boto3>=1.35,<2.0",
    "cryptography>=43,<51",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "langgraph>=0.2,<1.0",
    "langgraph-checkpoint-postgres>=2.0,<4.0",
    "openai>=1.50,<2.0",
    "openpyxl>=3.1,<4.0",
    "opentelemetry-api>=1.30,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.51b0,<1.0",
    "opentelemetry-instrumentation-httpx>=0.51b0,<1.0",
    "opentelemetry-sdk>=1.30,<2.0",
    "pgvector>=0.3,<1.0",
    "pdfplumber>=0.11,<1.0",
    "prometheus-client>=0.21,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-multipart>=0.0.20,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "python-docx>=1.1,<2.0",
    "redis[hiredis]>=5.2,<6.0",
    # 与 learning-langchain-CN 的本地 BGE-M3/BGE-Reranker 运行时保持稳定兼容，
    # 避免无约束升级到包含不必要 CUDA 组件的未来版本。
    "sentence-transformers==3.0.1",
    "torch==2.3.1",
    "transformers==4.41.2",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "structlog>=24.4,<26.0",
    "tenacity>=9.0,<10.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pypdf>=5,<7",
    "ruff>=0.8,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
