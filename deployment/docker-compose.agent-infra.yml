services:
  agent-postgres:
    image: pgvector/pgvector:pg16
    container_name: fitness-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fitness_agent
      POSTGRES_USER: fitness_agent
      POSTGRES_PASSWORD: fitness_agent
    ports:
      - "5433:5432"
    volumes:
      - fitness-agent-postgres-data:/var/lib/postgresql/data

  agent-trulens-postgres:
    # TruLens 评测数据必须与 Agent 业务/Checkpoint 数据库隔离；本服务是本地正式化验收环境。
    # 生产环境应通过 Secret Manager 覆盖账号密码，并使用独立托管 PostgreSQL 或数据库实例。
    image: pgvector/pgvector:pg16
    container_name: fitness-agent-trulens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TRULENS_POSTGRES_DB:-fitness_agent_eval}
      POSTGRES_USER: ${TRULENS_POSTGRES_USER:-fitness_eval}
      POSTGRES_PASSWORD: ${TRULENS_POSTGRES_PASSWORD:-fitness_eval_local}
    ports:
      - "${TRULENS_POSTGRES_PORT:-5434}:5432"
    volumes:
      - fitness-agent-trulens-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  agent-redis:
    image: redis:7.4-alpine
    container_name: fitness-agent-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - fitness-agent-redis-data:/data

  agent-rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: fitness-agent-rabbitmq
    restart: unless-stopped
    profiles: ["messaging"]
    environment:
      RABBITMQ_DEFAULT_USER: fitness_agent
      RABBITMQ_DEFAULT_PASS: fitness_agent_secret
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - fitness-agent-rabbitmq-data:/var/lib/rabbitmq

  agent-otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    container_name: fitness-agent-otel-collector
    restart: unless-stopped
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  agent-prometheus:
    # 仅作为本地 Metrics 抓取与规则验证组件；生产环境应固定镜像 digest，
    # 并把数据目录放到受控持久化存储，不直接复用本地卷。
    image: prom/prometheus:v2.54.1
    container_name: fitness-agent-prometheus
    restart: unless-stopped
    profiles: ["observability"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/fitness-agent-alerts.yml:/etc/prometheus/rules/fitness-agent-alerts.yml:ro
      - fitness-agent-prometheus-data:/prometheus
    ports:
      - "9090:9090"

  agent-alertmanager:
    # 本地告警路由组件；生产环境必须固定镜像 digest，并把 webhook 替换为企业内网 HTTPS 值班入口。
    image: prom/alertmanager:v0.27.0
    container_name: fitness-agent-alertmanager
    restart: unless-stopped
    profiles: ["observability"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - fitness-agent-alertmanager-data:/alertmanager
    ports:
      - "9093:9093"

  agent-minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    container_name: fitness-agent-minio
    restart: unless-stopped
    profiles: ["storage"]
    environment:
      MINIO_ROOT_USER: fitness_agent_minio
      MINIO_ROOT_PASSWORD: fitness_agent_minio_secret
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - fitness-agent-minio-data:/data

  agent-clamav:
    # Debian official image is multi-architecture and works on both Apple Silicon
    # development machines and amd64 production nodes. Pin a digest in deployment
    # manifests for production; this local tag tracks the approved stable line.
    image: clamav/clamav-debian:stable
    container_name: fitness-agent-clamav
    restart: unless-stopped
    profiles: ["security"]
    ports:
      - "3310:3310"
    volumes:
      - fitness-agent-clamav-data:/var/lib/clamav

  agent-ocr:
    # PaddlePaddle CPU wheels target Linux deployment nodes. Local Apple Silicon
    # development can call this service remotely or run it under amd64 emulation.
    platform: linux/amd64
    build:
      context: ../fitness-ocr-service
      dockerfile: Dockerfile
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn}
    image: fitness-ocr-service:local
    container_name: fitness-agent-ocr
    restart: unless-stopped
    profiles: ["ocr"]
    environment:
      OCR_ENVIRONMENT: ${OCR_ENVIRONMENT:-local}
      OCR_AUTH_REQUIRED: ${OCR_AUTH_REQUIRED:-false}
      OCR_API_KEY: ${OCR_API_KEY:-}
      OCR_DEVICE: ${OCR_DEVICE:-cpu}
      OCR_MAX_CONCURRENCY: ${OCR_MAX_CONCURRENCY:-1}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-50}
      OCR_MAX_SOURCE_BYTES: ${OCR_MAX_SOURCE_BYTES:-20971520}
      PADDLE_HOME: /models/paddle
    ports:
      - "8091:8091"
    volumes:
      - fitness-agent-ocr-models:/models/paddle

volumes:
  fitness-agent-postgres-data:
  fitness-agent-redis-data:
  fitness-agent-trulens-postgres-data:
  fitness-agent-minio-data:
  fitness-agent-clamav-data:
  fitness-agent-ocr-models:
  fitness-agent-rabbitmq-data:
  fitness-agent-prometheus-data:
  fitness-agent-alertmanager-data:
