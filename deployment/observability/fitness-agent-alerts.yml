groups:
  - name: fitness-agent-availability
    interval: 30s
    rules:
      - alert: FitnessAgentDown
        expr: up{job="fitness-agent"} == 0
        for: 2m
        labels:
          severity: critical
          service: fitness-agent
        annotations:
          summary: "健身 Agent 服务不可用"
          description: "Prometheus 连续 2 分钟无法抓取 Agent Metrics；请先检查进程、端口和容器网络。"

      - alert: FitnessAgentHighHttp5xxRate
        expr: |
          (
            sum(rate(fitness_agent_http_requests_total{job="fitness-agent",status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(fitness_agent_http_requests_total{job="fitness-agent"}[5m])), 0.001)
          ) > 0.05
          and sum(rate(fitness_agent_http_requests_total{job="fitness-agent"}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          service: fitness-agent
        annotations:
          summary: "健身 Agent HTTP 5xx 比例过高"
          description: "最近 5 分钟 HTTP 5xx 比例超过 5%；请结合 request_id、Trace 和下游依赖日志定位。"

      - alert: FitnessAgentHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(fitness_agent_http_request_duration_seconds_bucket{job="fitness-agent",route!="/api/v1/agent/chat/stream"}[5m])
            )
          ) > 2
        for: 10m
        labels:
          severity: warning
          service: fitness-agent
        annotations:
          summary: "健身 Agent P95 请求延迟过高"
          description: "最近 10 分钟 HTTP 请求 P95 延迟超过 2 秒；请检查模型、RAG、Gateway 和数据库耗时。"

      - alert: FitnessAgentRequestsBacklogged
        expr: sum(fitness_agent_http_requests_in_progress{job="fitness-agent"}) > 100
        for: 5m
        labels:
          severity: warning
          service: fitness-agent
        annotations:
          summary: "健身 Agent 请求持续堆积"
          description: "正在处理的 HTTP 请求连续 5 分钟超过 100；请检查线程/协程、模型超时和下游连接池。"

  - name: fitness-agent-business-safety
    interval: 30s
    rules:
      - alert: FitnessAgentOperationsAuditFailed
        expr: increase(fitness_agent_operations_query_events_total{job="fitness-agent",event="AUDIT_FAILED"}[10m]) > 0
        labels:
          severity: critical
          service: fitness-agent
        annotations:
          summary: "经营查询审计写入失败"
          description: "Operations 查询出现审计失败；系统应保持 fail-closed，需检查 PostgreSQL 和审计表。"

      - alert: FitnessAgentMaintenanceFailed
        expr: increase(fitness_agent_maintenance_runs_total{job=~"fitness-agent|fitness-agent-workers",status="failed"}[10m]) > 0
        labels:
          severity: warning
          service: fitness-agent
        annotations:
          summary: "健身 Agent 后台维护任务失败"
          description: "候选清理、Memory 保留、会话摘要或通知 Worker 最近 10 分钟出现失败批次。"

      - alert: FitnessAgentNotificationDeliveryFailed
        expr: increase(fitness_agent_notification_delivery_attempts_total{job=~"fitness-agent|fitness-agent-workers",status=~"RETRYABLE_FAILED|FINAL_FAILED"}[10m]) > 0
        labels:
          severity: warning
          service: fitness-agent
        annotations:
          summary: "健身 Agent 站内通知投递失败"
          description: "最近 10 分钟存在通知投递失败；请检查通知 Outbox、模板、渠道适配器和重试次数。"

      - alert: FitnessAgentDecisionActionFinalFailed
        expr: increase(fitness_agent_maintenance_items_total{job="fitness-agent-workers",worker="decision_action",outcome="final_failed"}[10m]) > 0
        labels:
          severity: critical
          service: fitness-agent
        annotations:
          summary: "经营决策动作最终失败"
          description: "经过授权的经营动作已耗尽重试并进入最终失败；案例会停在 EXECUTION_FAILED，需在决策控制台审查后重放。"

      - alert: FitnessAgentTruLensExportFailed
        expr: increase(fitness_agent_trulens_export_batches_total{job="fitness-agent",status="FAILED"}[10m]) > 0
        labels:
          severity: critical
          service: fitness-agent
        annotations:
          summary: "TruLens 在线评测导出失败"
          description: "最近 10 分钟存在 TruLens OTEL 批次写入失败；评测库可能缺少真实 Trace，应检查评测库连接、权限和容量。"

  - name: fitness-agent-runtime-delivery
    interval: 30s
    rules:
      - alert: FitnessAgentUsageLedgerFailed
        expr: increase(fitness_agent_usage_ledger_failures_total{job=~"fitness-agent|fitness-agent-workers"}[10m]) > 0
        labels:
          severity: critical
          service: fitness-agent
        annotations:
          summary: "模型用量账本持久化失败"
          description: "计費用量无法完整落盘；检查 PostgreSQL 与新迁移，未知用量不能当作零成本。"

      - alert: FitnessAgentSlowFirstAnswer
        expr: histogram_quantile(0.95, sum by (le) (rate(fitness_agent_chat_first_answer_seconds_bucket{job="fitness-agent"}[5m]))) > 10 and sum(rate(fitness_agent_chat_first_answer_seconds_count{job="fitness-agent"}[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
          service: fitness-agent
        annotations:
          summary: "有效答案首字延迟过高"
          description: "持续有足够样本时首个有效答案 P95 超过 10 秒；心跳和阶段事件不计为首字。"

      - alert: FitnessAgentModelFailureRate
        expr: sum(rate(fitness_agent_model_attempt_duration_seconds_count{status="FAILED"}[5m])) / clamp_min(sum(rate(fitness_agent_model_attempt_duration_seconds_count[5m])), 0.001) > 0.2 and sum(rate(fitness_agent_model_attempt_duration_seconds_count[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
          service: fitness-agent
        annotations:
          summary: "模型尝试失败比例过高"
          description: "真实模型尝试失败比例持续超过 20%；检查供应商限额、超时、熔断与模型配置。"

      - alert: FitnessAgentWorkerNotReady
        expr: fitness_agent_worker_ready{job="fitness-agent-workers",required="true"} == 0 or up{job="fitness-agent-workers",required="true"} == 0
        for: 3m
        labels:
          severity: warning
          service: fitness-agent
        annotations:
          summary: "必需 Worker 未就绪"
          description: "已明确启用的 Worker 连续 3 分钟未就绪或无法抓取；检查启动、租约、SIGTERM 和依赖配置。"

      - alert: FitnessAgentMultimodalWorkerUnavailable
        expr: max(fitness_agent_multimodal_api_enabled{job="fitness-agent"}) == 1 and on() ((sum(fitness_agent_worker_ready{job="fitness-agent-workers",profile="multimodal"}) or vector(0)) < 1)
        for: 3m
        labels:
          severity: critical
          service: fitness-agent
        annotations:
          summary: "多模态 Worker 不可用"
          description: "多模态 API 已启用但没有可用的多模态 Worker；分析任务与素材清理可能积压。"

  - name: fitness-mcp-reliability
    rules:
      - alert: FitnessMcpCatalogUnavailable
        expr: fitness_agent_mcp_enabled == 1 and fitness_agent_mcp_catalog_available == 0
        for: 3m
        labels:
          severity: warning
          service: fitness-agent
        annotations:
          summary: MCP目录不可用或契约不匹配
          description: 检查服务状态、有效凭证和冻结的工具Schema，禁止自动写入回退。
      - alert: FitnessConfirmationReconciliationStalled
        expr: fitness_agent_confirmation_reconciliation_backlog > 0 and fitness_agent_confirmation_reconciliation_oldest_seconds > 600
        for: 5m
        labels:
          severity: warning
          service: fitness-agent
        annotations:
          summary: 业务写入结果长期未核实
          description: 检查对账Worker、服务身份及下游事务证据；保留原ID与JTI，不重复写入。
      - alert: FitnessConfirmationManualReviewPending
        expr: fitness_agent_confirmation_manual_review_backlog > 0
        for: 10m
        labels:
          severity: warning
          service: fitness-agent
        annotations:
          summary: 本地确认动作需要人工核实
          description: 按原业务ID检查事实和审计，不因未知而重放动作。

  - name: fitness-multimodal-reliability
    rules:
      - alert: FitnessMultimodalUnknownOutcome
        expr: sum(increase(fitness_agent_multimodal_runs_total{outcome="unknown"}[10m])) > 0
        for: 1m
        labels:
          severity: warning
          service: fitness-agent
        annotations:
          summary: 多模态模型调用结果未确认
          description: 先核对供应商记录和计费，再决定是否手动重新提交；不要自动重放。
      - alert: FitnessMultimodalCleanupRetries
        expr: sum(increase(fitness_agent_multimodal_cleanup_total{outcome="retry"}[15m])) >= 3
        for: 5m
        labels:
          severity: warning
          service: fitness-agent
        annotations:
          summary: 多模态素材清理持续失败
          description: 检查 OSS 权限、版本控制、网络和删除队列，避免私有素材长期残留。
      - alert: FitnessMultimodalModelErrors
        expr: sum(increase(fitness_agent_multimodal_runs_total{outcome=~"model_failed|internal_error"}[10m])) >= 5
        for: 5m
        labels:
          severity: warning
          service: fitness-agent
        annotations:
          summary: 多模态分析连续失败
          description: 检查模型可用性、配额、认证与 Worker 日志；日志不得包含素材地址或正文。
