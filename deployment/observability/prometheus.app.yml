global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/fitness-agent-alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: fitness-agent
    static_configs:
      - targets: ["agent-api:8090"]
  - job_name: fitness-agent-workers
    file_sd_configs:
      - files: ["/etc/prometheus/worker-targets.json"]
        refresh_interval: 30s
