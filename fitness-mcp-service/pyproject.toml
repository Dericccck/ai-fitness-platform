[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fitness-mcp-service"
version = "0.1.0"
description = "Private first-party MCP adapter for the fitness Java Tool Gateway"
requires-python = ">=3.11"
dependencies = [
  "fitness-tool-contracts==1.0.0",
  "mcp==2.3.0",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "prometheus-client>=0.21,<1",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]

[tool.uv.sources]
fitness-tool-contracts = { path = "../packages/fitness-tool-contracts", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
